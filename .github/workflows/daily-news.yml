name: Daily NYT News Summary

on:
  # 定时触发：UTC 13:00（北京时间 21:00）；结合当前约 4 小时的排队延迟，预期次日 1:00 左右执行
  schedule:
    - cron: '0 13 * * *'

  # 支持手动触发
  workflow_dispatch:
    inputs:
      hours:
        description: '时间范围（小时）'
        required: false
        default: '49'
        type: string

jobs:
  summarize-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: summary
        run: uv sync --locked

      - name: Restore seen links cache
        uses: actions/cache/restore@v4
        with:
          path: summary/seen_links.json
          key: seen-links-${{ runner.os }}-${{ github.run_id }}
          restore-keys: seen-links-${{ runner.os }}-

      - name: Run news summarization
        working-directory: summary
        env:
          # LLM Configuration: MODEL is required (provider/model)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE }}
          GROQ_API_BASE: ${{ vars.GROQ_API_BASE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_BASE: ${{ vars.GEMINI_API_BASE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_BASE: ${{ vars.ANTHROPIC_API_BASE }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_API_BASE: ${{ vars.COHERE_API_BASE }}
          MODEL: ${{ vars.MODEL }}

          # Telegram Configuration
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}

          # Logging
          LOG_LEVEL: INFO
          HOURS: ${{ github.event.inputs.hours || '49' }}
        run: |
          test -n "$MODEL" || { echo "Set the MODEL Actions variable (provider/model)" >&2; exit 1; }
          uv run --locked ./read_nyt_rss.py --hours "$HOURS"

      - name: Save seen links cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: summary/seen_links.json
          key: seen-links-${{ runner.os }}-${{ github.run_id }}

      - name: Upload summary artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyt-summary-${{ github.run_number }}
          path: summary/nyt_summary.txt
          retention-days: 7
          if-no-files-found: ignore
