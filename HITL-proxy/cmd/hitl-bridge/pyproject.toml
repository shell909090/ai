[project]
name = "hitl-bridge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3.0"]

[project.scripts]
hitl-bridge = "hitl_bridge:main"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
