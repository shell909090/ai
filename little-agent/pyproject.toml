[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "little-agent"
version = "0.1.0"
description = "A minimal agent system with CLI frontend"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "openai>=3.40.0",
    "anthropic>=2.3.0",
    "aiohttp>=3.14.5",
    "prompt_toolkit>=3.0.53",
    "mcp>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.3",
    "mypy>=2.4.0",
]

[project.scripts]
little-agent = "little_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["little_agent"]
artifacts = ["little_agent/_static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C90"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D107", "UP037", "UP007"]
mccabe.max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
markers = [
    "ci: CI integration tests that require a real backend config file",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.3",
    "mypy>=2.4.0",
    "types-pyyaml>=6.0.12.20260906",
]
eval = [
    "chardet>=7.7.0",
]
