[project]
name = "all2txt"
version = "0.1.1"
description = "Extract plain text from any file format for vector search pipelines"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
tika = ["tika>=3.3.2"]
pymupdf = ["pymupdf>=2.0"]
unstructured = ["unstructured[all-docs]>=0.27.35"]
7zip = ["py7zr>=1.1.4"]
rar = ["rarfile>=4.5"]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[project.scripts]
all2txt = "all2txt.__main__:main"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=all2txt --cov-report=term-missing --cov-fail-under=75"

[tool.uv]
# unstructured caps filelock below 4; override for CVE-2026-112940.
# Remove when upstream relaxes its constraint to allow fixed filelock releases.
override-dependencies = ["filelock>=4.2.4,<5"]
